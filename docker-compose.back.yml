version: '3.4'

services:
    certbot:
        image: certbot/certbot
        container_name: certbot
        restart: always
        volumes:
            - ./docker/certbot/conf:/etc/letsencrypt
            - ./docker/certbot/www:/var/www/certbot
        restart: unless-stopped
        entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

    nginx:
        image: nginx:latest
        container_name: nginx
        restart: always
        ports:
            - "${NGINX_PORT:-80}:80"
            - "${NGINX_PORT_SSL:-443}:443"
        volumes:
            - ./docker/nginx/core:/etc/nginx/conf.d
            - ./:/var/www/
            - ./docker/nginx/logs:/var/log/nginx/
            - ./docker/nginx/templates:/etc/nginx/templates
            - ./docker/certbot/conf:/etc/letsencrypt
        links:
            - php
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            - HOST_URL=${HOST_URL}
            - HOST_NAME=${HOST_NAME}
            - BACK_PROXY_URL=${BACK_PROXY_URL}
            - FRONT_PROXY_URL=${FRONT_PROXY_URL}
            - NGINX_ENVSUBST_TEMPLATE_SUFFIX=${NGINX_ENVSUBST_TEMPLATE_SUFFIX}
            - FRONT_NGINX_AUTH_BOOL=${FRONT_NGINX_AUTH_BOOL}

    mysql:
        image: mysql:5.7
        container_name: mysql
        restart: always
        environment:
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - MYSQL_DATABASE=${MYSQL_DATABASE}
            - MYSQL_USER=${MYSQL_USER}
            - MYSQL_PASSWORD=${MYSQL_PASSWORD}
        volumes:
            - ./docker/mysql/db:/var/lib/mysql
            - ./docker/mysql/config/custom.cnf:/etc/mysql/conf.d/custom.cnf

    php:
        image: php:7.4-yii2
        build: ./docker/php
        container_name: php-fpm
        restart: always
        volumes:
            - ./:/var/www
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/40-custom.ini
        links:
            - mysql
networks:
    default:
        driver: bridge
        driver_opts:
            com.docker.network.driver.mtu: 1450